spring.application.name=petshop

# Database Connection
# ใช้ตัวแปร Environment Variables จาก Render
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# ใช้ update เพื่อให้ Hibernate สร้าง Table ให้โดยอัตโนมัติในครั้งแรก
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ลบ hibernate.dialect ออกเพราะ Spring Boot 3 ตรวจสอบเองได้
# และช่วยลด Warning HHH90000025 ใน Log

# Jackson & Security
spring.jackson.serialization.fail-on-empty-beans=false

# Error Handling
server.error.include-stacktrace=never
server.error.include-message=always

# Multipart (สำหรับการอัปโหลดไฟล์รูปภาพ)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

